[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embodied-lake"
version = "0.1.1"
description = "LeRobot-native, self-hosted data platform for embodied AI: format Babel layer, QC pipeline, dataset management."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "embodied-lake contributors" }]
keywords = ["robotics", "embodied-ai", "lerobot", "datasets", "data-platform", "mcap", "rerun"]
# Core keeps zero heavy dependencies on purpose (stdlib-only inspection/catalog/API).
dependencies = []

[project.optional-dependencies]
babel = [  # format conversion + QC/scoring: what `elake convert/qc/score/ingest` needs
  "pyarrow>=15",            # parquet read/write (v2.1 -> v3.0 artifacts)
  "pandas>=2.0",            # upstream-compatible tasks.parquet layout
  "numpy>=1.24",            # stats aggregation + scoring rules
  "mcap>=1.2",              # MCAP container reading
  "mcap-ros2-support>=0.5", # CDR/ros2msg decoding (JointState etc.)
  "h5py>=3.10",             # ALOHA/robomimic HDF5 reading
]
viz = [  # `elake preview` (Rerun .rrd rendering)
  "rerun-sdk>=0.20",
  "pyarrow>=15",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]
all = ["embodied-lake[babel,viz]"]

[project.scripts]
elake = "embodied_lake.cli:main"

[project.urls]
Homepage = "https://github.com/kittimzhe/embodied-lake"
Issues = "https://github.com/kittimzhe/embodied-lake/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/embodied_lake"]

[tool.ruff]
line-length = 100
target-version = "py310"
